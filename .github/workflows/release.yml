name: Release

# Push a tag like v0.2.0 -> build and test (no publishing rights), publish to PyPI
# (Trusted Publishing, no stored token, gated by the `pypi` environment), then list
# the server in the official MCP Registry (GitHub OIDC, no stored token).
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

env:
  MCP_PUBLISHER_VERSION: v1.8.9
  MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history, for the ancestry check below
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tagged commit is on master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/master"; exit 1; }
      - name: Install pinned build tools (hash-checked)
        run: pip install --require-hashes -r .github/release/release-tools.txt
      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -m hatchling version)
          test "$TAG" = "$VERSION" || { echo "::error::tag $TAG != package $VERSION"; exit 1; }
          grep -q "\"version\": \"$VERSION\"" server.json || { echo "::error::server.json version mismatch"; exit 1; }
      # Build from the clean checkout with the pinned backend, before any other install.
      - run: python -m build --no-isolation
      - run: twine check --strict dist/*
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: black --check src tests
      - run: isort --check-only src tests
      - run: mypy src
      - run: pytest -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing; the only job that can publish to PyPI
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait for PyPI to serve the new version
        run: |
          V="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/macropulse-mcp/$V/json" >/dev/null && exit 0
            sleep 10
          done
          echo "::error::macropulse-mcp $V not visible on PyPI"; exit 1
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
