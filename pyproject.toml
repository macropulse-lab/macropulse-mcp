[project]
name = "macropulse-mcp"
version = "0.1.0"
description = "MCP server for MacroPulse — daily macro regime classification as native AI tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MacroPulse", email = "support@macropulse.live" }]
keywords = ["mcp", "macro", "regime", "trading", "finance", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://macropulse.live"
Documentation = "https://macropulse.live/api-docs"
Repository = "https://github.com/GabrielGauss/macropulse-mcp"

[project.scripts]
macropulse-mcp = "macropulse_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macropulse_mcp"]
