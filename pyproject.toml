[project]
name = "macropulse-mcp"
dynamic = ["version"]
description = "MCP server for MacroPulse: the daily macro regime (Statistical Jump Model) as tools for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "MacroPulse", email = "support@macropulse.live" }]
keywords = ["mcp", "macro", "regime", "finance", "claude", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://macropulse.live"
Documentation = "https://macropulse.live/api-docs"
Repository = "https://github.com/macropulse-lab/macropulse-mcp"
Issues = "https://github.com/macropulse-lab/macropulse-mcp/issues"

[project.scripts]
macropulse-mcp = "macropulse_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/macropulse_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/macropulse_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "server.json", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: read-only smoke test against the public production API (set MACROPULSE_LIVE_SMOKE=1)",
]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
